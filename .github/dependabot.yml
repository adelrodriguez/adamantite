version: 2
updates:
  # Dependabot supports pnpm through v10. Keep pnpm 12 dependency updates manual.
  # Continue automatic version updates for GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "adelrodriguez"
    assignees:
      - "adelrodriguez"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
