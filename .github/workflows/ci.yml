name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Minimum runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup minimum Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Test package with minimum Node.js
        run: |
          compatibility_dir="${RUNNER_TEMP}/adamantite-node-compatibility"
          mkdir "${compatibility_dir}"
          npm pack --pack-destination "${compatibility_dir}"
          cd "${compatibility_dir}"
          npm init --yes
          npm install --engine-strict ./adamantite-*.tgz
          node node_modules/adamantite/bin/adamantite --help
          node --input-type=module --eval 'await import("adamantite/lint")'
          node --input-type=module --eval 'await import("adamantite/lint/antislop")'
          node -p 'require.resolve("adamantite/typescript")'
          oxlint_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies.oxlint")"
          npm install "oxlint@${oxlint_version}"
          npm pkg set type=module
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import antislop from "adamantite/lint/antislop"' '' 'export default defineConfig({ extends: [antislop] })' > oxlint.config.ts
          printf '%s\n' 'export const value = JSON.parse("{}") as unknown as string' > bad.ts
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.ts > oxlint-output.txt 2>&1; then
            echo "Expected anti-slop diagnostics from the packaged preset to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "anti-slop(no-chained-type-assertions)" oxlint-output.txt

      - name: Test package with minimum Bun
        run: |
          compatibility_dir="${RUNNER_TEMP}/adamantite-node-compatibility"
          cd "${compatibility_dir}"
          npx --yes bun@1.0.0 node_modules/adamantite/bin/adamantite --help
          npx --yes bun@1.0.0 node_modules/adamantite/dist/presets/lint/core.js

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check
            command: bun run check
          - name: format
            command: bun run format --check
          - name: test
            command: bun run test
          - name: analyze
            command: bun run analyze
          - name: build
            command: bun run build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
