name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.0.0-rc.6"

      # Setup Node.js to enable trusted publishing with OIDC authentication.
      # The registry-url configures npm to use GitHub Actions OIDC tokens for
      # authentication, eliminating the need for NPM_TOKEN secrets. When
      # changeset publish runs npm publish, it will automatically use OIDC
      # and generate provenance attestations.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
