name: test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: compat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.4.2"

      - name: Setup minimum Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Test package with minimum Node.js
        run: |
          compatibility_dir="${RUNNER_TEMP}/adamantite-node-compatibility"
          mkdir "${compatibility_dir}"
          npm pack --pack-destination "${compatibility_dir}"
          cd "${compatibility_dir}"
          npm init --yes
          npm install --engine-strict ./adamantite-*.tgz
          node node_modules/adamantite/bin/adamantite --help
          node --input-type=module --eval 'await import("adamantite/lint")'
          node --input-type=module --eval 'await import("adamantite/lint/antislop")'
          node --input-type=module --eval 'const fs = await import("node:fs"); const url = await import("node:url"); const path = url.fileURLToPath(import.meta.resolve("adamantite/typescript")); if (!fs.statSync(path).isFile()) process.exit(1)'
          oxlint_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies.oxlint")"
          npm install "oxlint@${oxlint_version}"
          npm pkg set type=module
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import antislop from "adamantite/lint/antislop"' '' 'export default defineConfig({ extends: [antislop] })' > oxlint.config.ts
          printf '%s\n' 'export const value = JSON.parse("{}") as unknown as string' > bad.ts
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.ts > oxlint-output.txt 2>&1; then
            echo "Expected anti-slop diagnostics from the packaged preset to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "anti-slop(no-chained-type-assertions)" oxlint-output.txt
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import reactStrict from "adamantite/lint/react-strict"' '' 'export default defineConfig({ extends: [reactStrict] })' > oxlint.config.ts
          printf '%s\n' 'import { useState } from "react"' '' 'export const Counter = () => useState(0)[0]' > bad.tsx
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.tsx > oxlint-output.txt 2>&1; then
            echo "Expected diagnostics from the packaged react-strict preset and the first-party plugin to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "adamantite(no-react-state-hooks)" oxlint-output.txt
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import strict from "adamantite/lint/strict"' '' 'export default defineConfig({ extends: [strict] })' > oxlint.config.ts
          printf '%s\n' 'export const name = ({ data: { user: { name } } }: { data: { user: { name: string } } }) => name' > bad.ts
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.ts > oxlint-output.txt 2>&1; then
            echo "Expected diagnostics from the packaged strict preset and the first-party plugin to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "adamantite(no-overzealous-destructuring)" oxlint-output.txt
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import tanstack from "adamantite/lint/tanstack"' '' 'export default defineConfig({ extends: [tanstack] })' > oxlint.config.ts
          printf '%s\n' 'import { useQuery } from "@tanstack/react-query"' 'import { createFileRoute } from "@tanstack/react-router"' '' 'const User = () => useQuery({ queryKey: ["user"] })' 'export const Route = createFileRoute("/user")({ component: User })' > bad.tsx
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.tsx > oxlint-output.txt 2>&1; then
            echo "Expected diagnostics from the packaged tanstack preset and the first-party plugin to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "adamantite(query-from-loader)" oxlint-output.txt
          # Custom rules load from .adamantite/rules through custom() and adamantite/rules.
          mkdir -p .adamantite/rules
          printf '%s\n' 'import { defineRule } from "adamantite/rules"' '' 'export default defineRule({' '  meta: { messages: { unexpected: "No debugger here." }, type: "problem" },' '  createOnce(context) {' '    return { DebuggerStatement(node) { context.report({ messageId: "unexpected", node }) } }' '  },' '})' > .adamantite/rules/no-debugger-here.ts
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import custom from "adamantite/lint/custom"' '' 'export default defineConfig({ extends: [custom()] })' > oxlint.config.ts
          printf '%s\n' 'export function stop() {' '  debugger' '}' > bad.ts
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.ts > oxlint-output.txt 2>&1; then
            echo "Expected diagnostics from the packaged custom() preset and a custom rule to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "project(no-debugger-here)" oxlint-output.txt
          shadcn_lint_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies['@shadcn/lint']")"
          typescript_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies.typescript")"
          # A target project lists TypeScript itself. Without that entry, npm cannot add the plugin
          # in a separate step: see ADR 0003.
          npm install "typescript@${typescript_version}" "@shadcn/lint@${shadcn_lint_version}"
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import shadcn from "adamantite/lint/shadcn"' '' 'export default defineConfig({ extends: [shadcn] })' > oxlint.config.ts
          printf '%s\n' 'export const Panel = () => <div style={{ padding: 16 }}>Panel</div>' > bad.tsx
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.tsx > oxlint-output.txt 2>&1; then
            echo "Expected shadcn diagnostics from the packaged preset and the managed plugin to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "shadcn(no-inline-styles)" oxlint-output.txt
          react_doctor_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies['oxlint-plugin-react-doctor']")"
          npm install "oxlint-plugin-react-doctor@${react_doctor_version}"
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import reactDoctor from "adamantite/lint/react-doctor"' '' 'export default defineConfig({ extends: [reactDoctor] })' > oxlint.config.ts
          printf '%s\n' 'import { useEffect } from "react"' '' 'export function Product({ isInCart }: { isInCart: boolean }) {' '  useEffect(() => {' '    if (isInCart) {' '      alert("Added to the cart")' '    }' '  }, [isInCart])' '  return <p>Product</p>' '}' > bad.tsx
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.tsx > oxlint-output.txt 2>&1; then
            echo "Expected react-doctor diagnostics from the packaged preset and the managed plugin to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "react-doctor(no-effect-event-handler)" oxlint-output.txt
          tsgolint_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies['oxlint-tsgolint']")"
          effect_tsgo_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).devDependencies['@effect/tsgo']")"
          effect_version="$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/adamantite/package.json', 'utf8')).dependencies.effect")"
          npm install "oxlint-tsgolint@${tsgolint_version}" "@effect/tsgo@${effect_tsgo_version}" "effect@${effect_version}"
          # The effecttsgo rules exist only in the patched binaries: see ADR 0007.
          ./node_modules/.bin/effect-tsgo patch --oxlint --typescript
          printf '%s\n' '{ "compilerOptions": { "strict": true, "module": "esnext", "moduleResolution": "bundler" } }' > tsconfig.json
          printf '%s\n' 'import { defineConfig } from "oxlint"' 'import effect from "adamantite/lint/effect"' '' 'export default defineConfig({ extends: [effect] })' > oxlint.config.ts
          printf '%s\n' 'import * as Effect from "effect/Effect"' '' 'export function run() {' '  Effect.log("lost")' '}' > bad.ts
          if ./node_modules/.bin/oxlint -c oxlint.config.ts bad.ts > oxlint-output.txt 2>&1; then
            echo "Expected effect diagnostics from the packaged preset and the patched Oxlint to fail the lint run"
            cat oxlint-output.txt
            exit 1
          fi
          grep "effecttsgo(floating-effect)" oxlint-output.txt

      - name: Setup minimum Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0.0"

      - name: Run package with minimum Bun
        run: |
          compatibility_dir="${RUNNER_TEMP}/adamantite-node-compatibility"
          cd "${compatibility_dir}"
          bun node_modules/adamantite/bin/adamantite --help
          bun node_modules/adamantite/dist/presets/lint/core.js
          # Bun prints stack frames as plain paths; custom() must still find the calling file.
          printf '%s\n' 'import custom from "adamantite/lint/custom"' '' 'const config = custom()' 'if (config.rules?.["project/no-debugger-here"] !== "error") {' '  console.error(JSON.stringify(config))' '  process.exit(1)' '}' > custom-check.mjs
          bun "${compatibility_dir}/custom-check.mjs"

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            command: pnpm run test:unit
          - name: presets
            command: pnpm run test:presets
          - name: e2e
            command: pnpm run test:dist

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.4.2"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload failed test report
        if: failure() && matrix.name != 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-test-report
          path: .vitest/index.html
          include-hidden-files: true
          retention-days: 7
