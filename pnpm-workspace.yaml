# This file must not gain a `packages` key, which would mark the repository as a monorepo.

# pnpm 12 rejects packages younger than one day, even with a frozen lockfile. These were published
# on 2026-11-13. Delete this list after 2026-11-14.
minimumReleaseAgeExclude:
