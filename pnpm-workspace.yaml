# pnpm 12 rejects packages younger than one day, even with a frozen lockfile. These were
# published on 2026-11-02. Delete this file after 2026-11-03; it has no other purpose, and it
# must not gain a `packages` key, which would mark the repository as a monorepo.
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.2"
  - "@effect/platform-node@4.1.2"
  - "effect@4.1.2"
  - "@effect/tsgo-darwin-arm64@0.64.1"
  - "@effect/tsgo-darwin-x64@0.64.1"
  - "@effect/tsgo-linux-arm64@0.64.1"
  - "@effect/tsgo-linux-arm@0.64.1"
  - "@effect/tsgo-linux-x64@0.64.1"
  - "@effect/tsgo-win32-arm64@0.64.1"
  - "@effect/tsgo-win32-x64@0.64.1"
  - "@effect/tsgo@0.64.1"
  - "@effect/vitest@4.1.2"
